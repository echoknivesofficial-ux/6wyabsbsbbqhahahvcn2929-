databases:
  - name: vcn-postgres
    databaseName: vcn
    user: vcn
    plan: free
    region: oregon

services:
  - type: web
    name: vcn-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vcn-postgres
          property: connectionString
      - key: NODE_ENV
        value: production
